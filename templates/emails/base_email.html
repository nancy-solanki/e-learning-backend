<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>{% block title %}Learnigy{% endblock %}</title>
  <style>
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0; mso-table-rspace: 0; }
    img { border: 0; display: block; }
    body { margin: 0; padding: 0; width: 100%; background: #f5f7ff; color: #18213d; font-family: Arial, Helvetica, sans-serif; }
    .page { width: 100%; padding: 32px 12px; background: #f5f7ff; }
    .card { width: 100%; max-width: 600px; margin: 0 auto; background: #ffffff; border: 1px solid #e7eafb; border-radius: 18px; overflow: hidden; }
    .brand { padding: 28px 32px; background: #171d4b; text-align: center; }
    .brand-mark { display: inline-block; width: 38px; height: 38px; margin-bottom: 10px; border-radius: 12px; background: #7868f6; color: #ffffff; font-size: 20px; font-weight: 700; line-height: 38px; }
    .brand-name { margin: 0; color: #ffffff; font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
    .brand-tagline { margin: 6px 0 0; color: #c8cdfa; font-size: 13px; }
    .content { padding: 40px 44px 36px; }
    h1 { margin: 0 0 18px; color: #171d4b; font-size: 26px; line-height: 1.25; letter-spacing: -0.5px; }
    p { margin: 0 0 18px; color: #58617c; font-size: 15px; line-height: 1.7; }
    strong { color: #30385c; }
    .button-wrap { padding: 8px 0 18px; text-align: center; }
    .button { display: inline-block; padding: 14px 26px; border-radius: 9px; background: #635bdb; color: #ffffff !important; font-size: 15px; font-weight: 700; line-height: 1; text-decoration: none; }
    .link-box { margin-top: 26px; padding: 16px; border: 1px solid #e2e5f6; border-radius: 10px; background: #f8f9ff; }
    .link-label { margin: 0 0 8px; color: #7a829d; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }
    .link { color: #5148bd; font-size: 13px; line-height: 1.6; word-break: break-all; }
    .note { margin: 24px 0 0; padding-top: 20px; border-top: 1px solid #eceef7; color: #8790a9; font-size: 13px; }
    .footer { padding: 22px 32px 28px; background: #fafaff; text-align: center; }
    .footer p { margin: 0; color: #9299b1; font-size: 12px; line-height: 1.6; }
    .footer a { color: #635bdb; text-decoration: none; }
    @media only screen and (max-width: 600px) {
      .page { padding: 12px 8px; }
      .content { padding: 32px 24px 28px; }
      .brand { padding: 24px; }
      h1 { font-size: 23px; }
      .button { display: block; }
    }
  </style>
</head>
<body>
  <table class="page" width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr><td align="center">
      <table class="card" cellpadding="0" cellspacing="0" role="presentation">
        <tr><td class="brand">
          <div class="brand-mark">L</div>
          <p class="brand-name">Learnigy</p>
          <p class="brand-tagline">Learn something new every day.</p>
        </td></tr>
        <tr><td class="content">
          {% block content %}{% endblock %}
        </td></tr>
        <tr><td class="footer">
          <p>&copy; {% now "Y" %} Learnigy. All rights reserved.<br />
          If you did not request this email, you can safely ignore it.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
