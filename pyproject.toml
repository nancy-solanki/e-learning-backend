[project]
name = "e-learning-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nancy Solanki", email = "nancysolanki.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "celery[redis]>=5.6.3",
    "cloudinary>=1.46.2",
    "coverage>=7.15.4",
    "dj-rest-auth[with-social]>=7.2.0",
    "django>=6.1",
    "django-allauth[socialaccount]>=65.19.2",
    "django-cloudinary-storage>=0.3.0",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.1",
    "django-redis>=7.0.0",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "drf-spectacular-sidecar>=2026.9.1",
    "factory-boy>=3.3.3",
    "flake8>=7.3.0",
    "httpie>=3.2.4",
    "isort>=8.0.1",
    "moviepy>=2.2.1",
    "psycopg[binary]>=3.3.4",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "python-dotenv>=1.2.3",
    "python-magic>=0.4.27",
]

[tool.uv]
package = false

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "coverage>=7.15.4",
    "flake8>=7.3.0",
    "httpie>=3.2.4",
    "isort>=8.0.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.15.1",
]
